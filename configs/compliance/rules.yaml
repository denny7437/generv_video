# compliance/rules.yaml — исполняемые правила комплаенса для рекламы автомобилей.
# Источник: пояснительная записка «Нейровидео» v2.0 от 22.08.2026, разделы 4.3–4.4.
# Владелец: A-12 (hermes-product). Изменения правил НЕ подлежат откату по метрике —
# вместо этого перезамеряется базовая линия (записка §5.2).
# Связка с тестами: tests/compliance/check_coverage.py читает id отсюда и сверяет
# с ключами tests/compliance/fixtures.yaml (гейт G1 — 100 % покрытия).
version: 2.0
owner: A-12

# Гейт G1: доля правил, покрытых автотестами на фикстурах, = 100 %.
stop_list:                          # ФЗ «О рекламе» (38-ФЗ: ст.5, 7, 21, 28) + общие нормы приличия
  - {id: false_claims,      desc: "недостоверные сведения о товаре и условиях (ст.5 ч.3 38-ФЗ)"}
  - {id: unfair_comparison, desc: "некорректное сравнение с конкурентами (ст.5 ч.2 п.1)"}
  - {id: superlatives,      desc: "превосходные степени без обоснования («лучший», «самый надёжный»)"}
  - {id: finance_terms,     desc: "кредит/рассрочка/лизинг без полных условий (ст.28 38-ФЗ)"}
  - {id: prohibited_goods,  desc: "реклама запрещённых товаров (табак, никотин, вейпы и др., ст.7)"}
  - {id: alcohol,           desc: "алкогольная продукция в кадре (ст.21 38-ФЗ)"}
  - {id: profanity,         desc: "нецензурная лексика, оскорбления"}
  - {id: adult_content,     desc: "эротика, интимные сцены"}
  - {id: misleading_state,  desc: "сокрытие/искажение состояния авто (пробег, ДТП, комплектация)"}
  - {id: personal_data,     desc: "персональные данные"}
  - {id: watermarks,        desc: "водяные знаки, чужие логотипы"}
  - {id: contacts_links,    desc: "контакты и ссылки вне маркировки рекламы"}
  - {id: illegal_ru,        desc: "контент, запрещённый законодательством РФ"}

platform_extra:
  autoru:
    - {id: ar_own_car_only, desc: "на видео не тот автомобиль, что в объявлении (правило Авто.ру)"}
  avito:
    - {id: av_contacts,     desc: "контакты, посторонние надписи, чужие изображения"}

# Маркировка рекламы (38-ФЗ, ст.18.1; с 01.09.2022). Ответственность рекламодателя,
# не наша; закладываем поле, не сервис.
ad_labeling:
  requirement: "при использовании ролика как интернет-рекламы — пометка «реклама» + рекламодатель + токен ERID"
  route: "ОРД → ЕРИР (Роскомнадзор)"
  note: "объявление на классифайде (Авто.ру/Авито) рекламой не является; маркировка нужна для таргета/соцсетей"

ai_labeling:                       # маркировка ИИ-контента (вступает в силу 01.03.2027)
  adopted: "2026-07-08"
  in_force_from: "2027-03-01"
  user_labeling: voluntary
  requirement: "поле маркировки ИИ-контента в модели данных с первого дня"

# Правило fidelity v2.0 — вшивается в промпты, валидатор и регламенты. Дословно:
# «Мы показываем машину такой, какая она на фото объявления, и даём сцене свободу.»
product_fidelity:
  allowed:
    - нейтральный или новый фон
    - свет
    - движение камеры и машины
    - человек в кадре
    - смена ракурса в пределах имеющихся фото
  forbidden:
    - изменение цвета кузова
    - изменение комплектации и опций
    - изменение состояния (царапины, вмятины, следы эксплуатации)
    - добавление или удаление элементов автомобиля
  rationale: >
    Для классифайдов и рекламы авто недостоверность — прямая потеря: Авто.ру требует
    «на видео только автомобиль, который вы продаёте», модераторы блокируют объявление;
    недостоверная реклама запрещена ст.5 38-ФЗ. Сцена (фон/свет/движение/человек)
    свободнее, чем в v1.1, потому что рекламный креатив допускает постановочный фон —
    риск не в сцене, а в досочинении самого автомобиля.
