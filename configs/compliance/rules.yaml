# compliance/rules.yaml — исполняемые правила комплаенса, по которым работает валидатор (стадия [5]).
# Источник: пояснительная записка «Нейровидео» v1.1 от 17.08.2026, разделы 4.3–4.4 (по официальным требованиям площадок).
# Владелец: A-12 (hermes-product). Изменения правил площадок НЕ подлежат откату по метрике —
# вместо этого перезамеряется базовая линия (записка §5.2).
version: 1.1
owner: A-12

# Гейт G1: доля правил, покрытых автотестами на фикстурах, = 100 %.
stop_list:                          # применимо ко всем площадкам, если не указано иное
  - {id: profanity,          desc: "нецензурная лексика, оскорбления"}
  - {id: alcohol_tobacco,    desc: "алкоголь, сигареты"}
  - {id: prices_contacts,    desc: "цены, скидки, контакты, ссылки на соцсети"}
  - {id: meta_platforms,     desc: "упоминания Instagram и Facebook (Meta)"}
  - {id: delivery_terms,     desc: "условия доставки и возврата («быстрая доставка», «привезём завтра»)"}
  - {id: competitor_ads,     desc: "реклама конкурирующих сайтов и магазинов"}
  - {id: watermarks,         desc: "водяные знаки"}
  - {id: personal_data,      desc: "персональные данные"}
  - {id: adult_content,      desc: "интимные части тела, эротические звуки"}
  - {id: value_judgements,   desc: "оценочные суждения («лучший», «хит», «топ»)"}
  - {id: sales_data,         desc: "данные о продажах («продано 100 шт.»)"}
  - {id: illegal_ru,         desc: "контент, запрещённый законодательством РФ"}

platform_extra:
  wildberries:
    - {id: wb_collage,       desc: "коллажи"}
    - {id: wb_multi_product, desc: "несколько товаров в одном кадре"}
    - {id: wb_packaging,     desc: "товар в упаковке на главном изображении"}
    - {id: wb_marketing,     desc: "маркетинговый текст об акциях и сезонности"}
  yandex_market:
    - {id: ym_screen_share,  desc: "товар занимает менее 2/3 экрана или не в рабочем состоянии"}
    - {id: ym_subtitles,     desc: "есть речь, но нет субтитров"}

# Правило 4.4 записки — вшивается в промпты, валидатор и регламенты. Дословно:
# «Мы анимируем товар, а не досочиняем его.»
product_fidelity:
  allowed:
    - движение камеры
    - свет
    - смена ракурса в пределах имеющихся фото
    - нейтральный фон
    - мягкое движение самого товара
  forbidden:
    - добавление или удаление комплектующих
    - изменение цвета
    - изменение материала
    - изменение формы
    - изменение надписей на товаре
    - добавление людей
    - добавление предметов, отсутствующих в карточке
  rationale: >
    Недостоверность — главный юридический риск: Ozon — 200 штрафных баллов на 2 месяца
    (повтор — 400 на 4, блокировка кабинета при 1200), 289-ФЗ — проверка достоверности с 01.10.2026.
    Генерация ИЗ реальных фото легитимизирована самим Ozon; риск — там, где модель добавляет
    то, чего в товаре нет.
