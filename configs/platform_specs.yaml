# platform_specs.yaml — технические требования площадок в машиночитаемом виде.
# Источник: пояснительная записка «Нейровидео» v2.0 от 22.08.2026, раздел 4.1.
# Владелец: A-12 (hermes-product). Каждое значение — с источником и датой проверки.
version: 2.0
owner: A-12

platforms:
  autoru:
    video:
      per_listing: 1
      upload_method: "по ссылке (Rutube / VK Видео / VK Клипы), не прямой файл"
      note: "для мотоциклов и коммерческого транспорта — только в мобильном приложении"
      content_rule: "на видео должен быть только автомобиль, который продаётся"
      max_size_mb: null             # лимит не опубликован явно (сниппет «5 ГБ» — требует перепроверки)
      verified: true
      source: "https://yandex.ru/support/autoru/ru/car-rules-ads"
      checked_at: "2026-08-22"
    photos:
      max_count: 40
      format: [jpg]
      aspect: "4:3"
      max_size_mb: 20
      min_width_px: 900
    moderation:
      note: "модераторы могут заблокировать объявление или личный кабинет за несоблюдение правил"

  avito:
    video:
      formats: [mp4, mov, hevc, webm]
      duration_sec: {min: 5, max: 180, recommended_max: 60}
      max_size_mb: 500
      orientation: "вертикальная"
      note: "в категории «Автомобили» для загрузки видео нужен тариф"
      benefit: "продавцы с видео получают в среднем +15% заказов с доставкой"
      verified: true
      source: "https://www.avito.ru/business/tools/upload_video"
      checked_at: "2026-08-22"
    photos:
      format: [jpg, png, gif]
      max_size_mb: 25

  drom:
    video_supported: false          # КРИТИЧНО: видео в объявлении не поддерживается
    note: "в объявлении только фото в формате jpeg"
    implication: "ролик для Дром неприменим в объявлении — только как сторонняя реклама"
    verified: true
    source: "https://www.drom.ru/faq/toyota/corolla_levin/Dobriy-vecher-Podskazhite-kak-dobavit-video-v-obyavlenie-223958.html"
    checked_at: "2026-08-22"

legal:
  fz_advertising:                   # ФЗ «О рекламе» 38-ФЗ от 13.03.2006
    in_force: "2006-07-01"
    key_articles:
      art5: "добросовестность и достоверность рекламы"
      art7: "товары, реклама которых не допускается"
      art21: "реклама алкогольной продукции"
      art28: "реклама финансовых услуг (кредит/рассрочка/лизинг)"
  ad_labeling:                      # маркировка интернет-рекламы
    in_force_from: "2022-09-01"
    note: "пометка «реклама» + рекламодатель + токен ERID; учёт через ОРД → ЕРИР (Роскомнадзор)"
  ai_labeling:                      # маркировка ИИ-контента
    adopted: "2026-07-08"
    in_force_from: "2027-03-01"
    user_labeling: voluntary
    requirement: "поле маркировки ИИ-контента в модели данных с первого дня"
