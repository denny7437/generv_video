# platform_specs.yaml — технические требования площадок в машиночитаемом виде.
# Источник: пояснительная записка «Нейровидео» v1.1 от 17.08.2026, раздел 4.1 (по официальным справкам).
# Владелец: A-12 (hermes-product). Каждое значение подлежит верификации по первоисточнику
# с датой проверки — до верификации verified: false.
version: 1.1
owner: A-12

platforms:
  ozon_cover:                       # видеообложка Ozon
    formats: [mp4, mov]
    duration_sec: {min: 8, max: 30}
    resolution_long_side_px: {min: 1080, max: 1920}
    aspect:
      clothing_home_garden: "3:4"
      other_categories: "1:1"
      note: "16:9 и 9:16 сильно обрезаются"
    max_size_mb: 20
    fps: null                        # официально не указано
    per_card: 1                      # вместо главного фото
    first_frame_sharp: true          # показывается, пока грузится видео
    must_read_without_sound: true
    verified: false
    source: "https://docs.ozon.ru/global/en/products/requirements/media/videocover-requirements/"
    checked_at: null

  ozon_gallery:                     # видео в галерее Ozon
    formats: [mp4, mov]
    duration_sec: {min: 8, max: 300}
    resolution_long_side_px: {min: 1080, max: 1920}
    max_size_mb: 100
    per_card: 5
    verified: false
    source: "https://docs.ozon.ru/global/en/products/requirements/media/video-requirements/"
    checked_at: null

  wildberries:
    formats: [mov, mp4]
    duration_sec: {min: null, max: 180}
    resolution_both_sides_px: {min: 720, max: 1920}
    max_size_mb: 50
    codecs: {video: [h264, mpeg-4], audio: [aac, mp3], audio_required: false}
    fps: {min: 25, max: 30}
    per_card: 1
    verified: false
    source: "https://seller.wildberries.ru/instructions/ru/ru/material/how-to-create-card"
    checked_at: null

  yandex_market:                    # фаза 3, вне MVP
    phase: 3
    formats: [mp4, webm, mov, avi]
    duration_sec: {min: null, max: 1200, recommended_max: 60}
    resolution_long_side_px: {min: 1080, max: 1920}
    max_size_mb: 100
    fps: {min: 20, max: 30}
    per_card: 6
    product_min_screen_share: 0.667  # товар не менее 2/3 экрана
    subtitles_required_if_speech: true
    verified: false
    source: "https://yandex.ru/support/marketplace/ru/assortment/create/main-fields/video"
    checked_at: null

sanctions:                          # разница санкций определяет приоритеты валидатора
  ozon:
    rejected_video: "карточка НЕ блокируется — товар уходит во вкладку «Ошибки»"
    false_info_penalty_points: {first: 200, months: 2, repeat: 400, repeat_months: 4, cabinet_block_at: 1200}
    risk: moderate
  wildberries:
    rejected_media: "карточка товара БЛОКИРУЕТСЯ"
    risk: high
    validator_mode: strict          # для WB валидатор работает в строгом режиме

legal:
  fz_289:                           # платформенная экономика
    in_force_from: "2026-10-01"
    note: "проверка достоверности карточек; выходить на рынок уже соответствующими"
  ai_labeling:
    adopted: "2026-07-08"
    in_force_from: "2027-03-01"
    user_labeling: voluntary
    requirement: "поле маркировки ИИ-контента в модели данных с первого дня"
