# master_format.yaml — единственный источник параметров формата видео.
# Источник: пояснительная записка «Нейровидео» v1.1 от 17.08.2026, раздел 4.2.
# Владелец: A-30 (hermes-architect). Числа отсюда не дублируются в других конфигах и в коде.
#
# Связывающие ограничения площадок — Ozon: 3:4, ≥1080 px по длинной стороне, ≤20 МБ, 8–30 с;
# квадратный дериват — тот же порог 1080 px; WB: 25–30 fps, H.264, ≤50 МБ.
# Кроп 1:1 из 810×1080 даёт 810×810 и модерацию НЕ проходит — поэтому мастер с запасом,
# а генерация в меньшем разрешении с апскейлом (768×1024 = 0,79 Мпикс — легче 720p).
version: 1.1
owner: A-30

generation:
  resolution: "768x1024"        # 3:4, обе стороны кратны 64 — нативный размер для моделей
  duration_sec: 8.0             # нативная длина Veo 3.1; на этой длине считается себестоимость

master:
  resolution: "1152x1536"       # апскейл x1.5 в постобработке (стадия [6])
  aspect: "3:4"
  duration_sec: 8.5             # 8.0 сгенерированных + 0.5 с стоп-кадра — запас к минимуму Ozon в 8 с
  fps: 25                       # внутри окна WB 25–30
  codec: "h264"
  audio: none                   # WB допускает аудио, но не требует
  max_size_mb: 18               # запас 10 % к лимиту Ozon в 20 МБ

derivatives:
  - id: ozon_cover_vertical
    aspect: "3:4"
    resolution: "1152x1536"
    source: master
    max_size_mb: 18
    note: "Одежда, Дом и сад"
  - id: ozon_cover_square
    aspect: "1:1"
    resolution: "1152x1152"
    source: center_crop_from_master
    max_size_mb: 18
    note: "остальные категории; 1152 даёт запас 6.7 % к порогу Ozon в 1080 px"
  - id: wb_card
    aspect: "3:4"
    resolution: "1152x1536"
    source: master
    max_size_mb: 45
  - id: yandex_card
    aspect: "3:4"
    resolution: "1152x1536"
    source: master
    max_size_mb: 90
    phase: 3                    # Яндекс Маркет вне MVP

tolerances:                     # валидатор проверяет с допусками, а не по точному равенству
  duration_sec_min: 8.2
  long_side_px_min: 1100
