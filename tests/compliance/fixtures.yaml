# Фикстуры комплаенса для гейта G1 (100 % правил покрыты автотестами на фикстурах).
# Пивот TEC-54: правила переписаны под рекламу автомобилей (38-ФЗ «О рекламе»).
#
# Ключ верхнего уровня — id правила из configs/compliance/rules.yaml
# (секции stop_list и platform_extra). Список правил здесь НЕ дублируется:
# единственный источник истины — rules.yaml. Скрипт tests/compliance/check_coverage.py
# читает ids из rules.yaml и сверяет их с ключами этого файла.
#
# Структура на правило:
#   probe:      [маркеры] — регистронезависимые подстроки (морфологические основы),
#               по которым скрипт проверяет, что violating-фикстура действительно
#               содержит нарушение, а clean-фикстура — ни одного маркера.
#   violating:  [тексты-нарушители] — минимум один.
#   clean:      [чистые тексты] — минимум один.

false_claims:
  probe: ["гарантируем", "самая низкая цена", "дешевле всех", "без вложений"]
  violating:
    - "Гарантируем самую низкую цену на рынке"
  clean:
    - "Седан 2019 года, один владелец, пробег 45 000 км"

unfair_comparison:
  probe: ["конкурент", "в отличие", "соседнего салона"]
  violating:
    - "Наши цены ниже, чем у конкурентов по соседству"
  clean:
    - "Седан в отличном состоянии, один владелец"

superlatives:
  probe: ["лучш", "самый", "топ", "хит"]
  violating:
    - "Лучший автомобиль в городе — топ за свои деньги"
  clean:
    - "Автомобиль в хорошем состоянии"

finance_terms:
  probe: ["кредит", "рассрочк", "лизинг", "одобрен"]
  violating:
    - "Кредит под 5% годовых без первоначального взноса"
  clean:
    - "Возможна продажа по договору купли-продажи"

prohibited_goods:
  probe: ["табак", "сигарет", "вейп", "никотин"]
  violating:
    - "В салоне пачка сигарет на приборной панели"
  clean:
    - "Салон в чистом состоянии без посторонних предметов"

alcohol:
  probe: ["вин", "водк", "пив", "алкогол", "бутылк"]
  violating:
    - "В кадре бутылка вина на заднем сиденье"
  clean:
    - "Багажник пустой и чистый"

profanity:
  probe: ["жоп", "сволоч", "идиот", "дурак"]
  violating:
    - "Этот двигатель — полная жопа, не берите"
  clean:
    - "Двигатель в рабочем состоянии"

adult_content:
  probe: ["эроти", "обнажён", "интим", "откровенн"]
  violating:
    - "В кадре откровенная эротическая сцена на фоне машины"
  clean:
    - "Автомобиль сфотографирован на нейтральном фоне"

misleading_state:
  probe: ["не бит", "родной пробег", "без дтп", "без единого дефекта"]
  violating:
    - "Не бит, не крашен, родной пробег 45 000"
  clean:
    - "Пробег указан по одометру, состояние соответствует фото"

personal_data:
  probe: ["паспорт", "снилс", "номер карты", "адрес"]
  violating:
    - "В кадр попал паспорт продавца на панели"
  clean:
    - "Салон автомобиля без личных документов"

watermarks:
  probe: ["водяной знак", "watermark", "логотип стока"]
  violating:
    - "В углу кадра виден водяной знак фотостока"
  clean:
    - "Фото автомобиля без надписей и логотипов"

contacts_links:
  probe: ["звон", "+7", "переходите", "instagram", "vk.com", "сайт"]
  violating:
    - "Звоните +7 900 000-00-00, переходите на наш сайт"
  clean:
    - "Седан 2019 года, один владелец"

illegal_ru:
  probe: ["наркоти", "казино", "оружи", "экстремист"]
  violating:
    - "В кадре реклама казино и наркотических средств"
  clean:
    - "Автомобиль на нейтральном фоне"

ar_own_car_only:
  probe: ["другой автомобиль", "не тот", "чужой автомобиль", "подмен"]
  violating:
    - "На видео показан другой автомобиль вместо того, что в объявлении"
  clean:
    - "На видео ровно тот автомобиль, что на фото объявления"

av_contacts:
  probe: ["телефон", "посторонняя надпись", "чужая фотография", "номер продавца"]
  violating:
    - "На фото посторонняя надпись с телефоном продавца"
  clean:
    - "Фото автомобиля без надписей и лишних элементов"
