# Фикстуры комплаенса для гейта G1 (100 % правил покрыты автотестами на фикстурах).
#
# Ключ верхнего уровня — id правила из configs/compliance/rules.yaml
# (секции stop_list и platform_extra). Список правил здесь НЕ дублируется:
# единственный источник истины — rules.yaml. Скрипт tests/compliance/check_coverage.py
# читает ids из rules.yaml и сверяет их с ключами этого файла.
#
# Структура на правило:
#   probe:      [маркеры] — регистронезависимые подстроки (морфологические основы),
#               по которым скрипт проверяет, что violating-фикстура действительно
#               содержит нарушение, а clean-фикстура — ни одного маркера.
#               Необязательное поле; без него проверяется только наличие фикстур.
#   violating:  [тексты-нарушители] — минимум один.
#   clean:      [чистые тексты] — минимум один.
#
# Фикстура — текстовый сэмпл, который валидатор стадии [5] увидит на входе:
# строка субтитра, оверлей-текст или текстовое описание кадра. Бинарных медиа
# в git нет (скилл hermes-qa-harness: генерировать на лету, не коммитить).

profanity:
  probe: ["жоп", "сволоч", "идиот"]
  violating:
    - "Товар оказался полной жопой — не советую брать"
  clean:
    - "Кружка керамическая объёмом 300 мл, белая"

